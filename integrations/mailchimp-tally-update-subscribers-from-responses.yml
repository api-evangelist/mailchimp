arazzo: 1.0.1
info:
  title: Update Mailchimp subscribers from new Tally responses
  summary: Update Mailchimp subscribers from new Tally responses
  description: Read a new Tally form submission and upsert the respondent in a Mailchimp audience. Recreates Zapier template 386739.
  version: 1.0.0
sourceDescriptions:
- name: tallySubmissions
  url: https://raw.githubusercontent.com/api-evangelist/tally/refs/heads/main/openapi/tally-submissions-api-openapi.yml
  type: openapi
- name: mailchimpLists
  url: https://raw.githubusercontent.com/api-evangelist/mailchimp/refs/heads/main/openapi/mailchimp-lists-api-openapi.yml
  type: openapi
workflows:
- workflowId: update-subscribers-from-responses
  summary: Update Mailchimp subscribers from new Tally responses
  description: Read a new Tally form submission and upsert the respondent in a Mailchimp audience. Recreates Zapier template 386739.
  inputs:
    type: object
    required:
    - formId
    - submissionId
    - listId
    - subscriberHash
    - emailAnswerPointer
    properties:
      formId:
        type: string
        description: Tally form id
      submissionId:
        type: string
        description: Tally submission id
      listId:
        type: string
        description: Mailchimp audience id
      subscriberHash:
        type: string
        description: MD5 of the lowercased email
      emailAnswerPointer:
        type: string
        description: 'unused documentation input: which answer holds the email'
  steps:
  - stepId: get-tally-submission
    description: Read the submission.
    operationId: $sourceDescriptions.tallySubmissions.getSubmission
    parameters:
    - name: id
      in: path
      value: $inputs.formId
    - name: submissionId
      in: path
      value: $inputs.submissionId
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      responses: $response.body#/responses
  - stepId: upsert-mailchimp-member
    description: Add or update the subscriber in the Mailchimp audience (PUT is an upsert keyed by the MD5 subscriber hash of the lowercased email).
    operationId: $sourceDescriptions.mailchimpLists.putListsIdMembersId
    parameters:
    - name: list_id
      in: path
      value: $inputs.listId
    - name: subscriber_hash
      in: path
      value: $inputs.subscriberHash
    requestBody:
      contentType: application/json
      payload:
        email_address: $steps.get-tally-submission.outputs.responses
        status_if_new: subscribed
        merge_fields:
          FNAME: ''
          LNAME: ''
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      memberId: $response.body#/id
      status: $response.body#/status
  outputs:
    memberId: $steps.upsert-mailchimp-member.outputs.memberId
x-integration:
  partner: tally
  edge_evidence: https://zapier.com/apps/mailchimp/integrations
  edge_type: marketplace
  method: generated
  generated: '2026-10-12'
  generator: claude-opus-5-5 enrichment local-v5
  template: https://zapier.com/apps/mailchimp/integrations/tally/386739/update-mailchimp-subscribers-from-new-tally-responses
  guessed_steps:
  - step: upsert-mailchimp-member
    cause: partner-contract
    why: Tally answers are an array keyed by question id; which entry is the email is form-specific, so the whole responses array is passed and must be mapped by the caller.
