arazzo: 1.0.1
info:
  title: 'mailchimp through highlevel: create-template preconfigured with mailchimp'
  summary: Calls highlevel's create-template with `mailchimp` preset, the way mailchimp is used inside highlevel.
  description: 'A PRECONFIGURATION, not an orchestration: mailchimp is a processor-connection inside highlevel,
    so the integration is highlevel''s own operation with mailchimp''s enum value set. Derived from highlevel''s
    contract (highlevel-templates-api-openapi.yml); required properties are inputs.'
  version: 1.0.0
x-integration:
  partner: highlevel
  relationship: processor-connection
  preconfig: true
  edge_evidence: https://github.com/api-evangelist/highlevel/blob/main/openapi/highlevel-templates-api-openapi.yml
  edge_type: contract
  preset:
    importProvider: mailchimp
  method: derived
  generated: '2026-10-12'
  generator: build-integration-preconfigs.py
sourceDescriptions:
- name: highlevelTemplatesApiOpenapi
  url: https://raw.githubusercontent.com/api-evangelist/highlevel/refs/heads/main/openapi/highlevel-templates-api-openapi.yml
  type: openapi
workflows:
- workflowId: mailchimp-via-highlevel-create-template
  summary: create-template with mailchimp preset
  inputs:
    type: object
    required:
    - locationId
    - type
    properties:
      locationId:
        type: string
      type:
        type: string
  steps:
  - stepId: call-with-preset
    operationId: $sourceDescriptions.highlevelTemplatesApiOpenapi.create-template
    requestBody:
      contentType: application/json
      payload:
        locationId: $inputs.locationId
        type: $inputs.type
        importProvider: mailchimp
    successCriteria:
    - condition: $statusCode == 201
    outputs:
      id: $response.body#/id
  outputs:
    id: $steps.call-with-preset.outputs.id
