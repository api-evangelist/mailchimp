description: >-
  Mailchimp is an Intuit company providing a marketing automation platform and email marketing service for managing
  mailing lists, creating email marketing campaigns, and automating marketing workflows. It exposes two distinct
  developer surfaces: the Marketing API (v3, REST, 298 operations at https://<dc>.api.mailchimp.com/3.0) covering
  audiences, members, tags, segments, campaigns, content, automations, customer journeys, reports, e-commerce
  stores and orders, file manager, templates, landing pages, batch operations and webhooks; and Mailchimp
  Transactional, formerly Mandrill (99 RPC-style POST methods at https://mandrillapp.com/api/1.0), for one-to-one
  transactional email and SMS, inbound processing, dedicated IP management and subaccounts. Authentication is an
  API key or OAuth 2 for the Marketing API and a body-parameter API key for Transactional. Mailchimp runs a hosted
  MCP server for the Transactional API, publishes eight official client libraries and two mobile SDKs, and delivers
  audience events as HMAC-signed webhooks.
