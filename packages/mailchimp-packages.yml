currency:
  checked: '2026-08-13'
  finding: >-
    The four MARKETING client libraries are frozen. Every one of them last
    published 3.0.80 on 2022-11-02 — the same day across npm, PyPI, RubyGems and
    Packagist, and the same date the four source repositories were last pushed —
    while the Marketing API contract Mailchimp serves at
    https://api.mailchimp.com/schema/3.0/Swagger.json is version 3.0.91. The
    official SDKs are eleven spec revisions and nearly four years behind the API
    they wrap. The four TRANSACTIONAL libraries are current: 1.4.1, published
    2026-03-24, matching the 1.4.1 spec in
    openapi/mailchimp-transactional-api-openapi-original.json.
