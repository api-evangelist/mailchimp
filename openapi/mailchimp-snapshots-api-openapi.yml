                          - PUT
                          - PATCH
                          - DELETE
                          - OPTIONS
                          - HEAD
                          readOnly: true
                          title: Method
                          type: string
                        rel:
                          description: As with an HTML 'rel' attribute, this describes the type of link.
                          readOnly: true
                          title: Rel
                          type: string
                        schema:
                          description: For HTTP methods that can receive bodies (POST and PUT), this is a URL representing the schema that the body should conform to.
                          readOnly: true
                          title: Schema
                          type: string
                        targetSchema:
                          description: For GETs, this is a URL representing the schema that the response should conform to.
                          readOnly: true
                          title: Target Schema
                          type: string
                      title: Resource Link
                      type: object
                    readOnly: true
                    title: Links
                    type: array
                  members:
                    description: A list of the members in a segment snapshot.
                    items:
                      description: A member of a segment snapshot. The contact ID identifies the member.
                      properties:
                        contact_id:
                          description: The contact ID of the segment member.
                          example: abc123def456
                          title: Contact ID
                          type: string
                      title: Segment Member
                      type: object
                    title: Segment Members
                    type: array
                  next_cursor:
                    description: A cursor pointing to the last item on this page of the collection. Paginate through a collection of records by setting the `cursor` parameter on a subsequent request to this value.
                    readOnly: true
                    title: Next Cursor
                    type: string
                type: object
          description: The API returns this when the snapshot is complete.
        '202':
          description: The API returns this when the snapshot is not complete.
        default:
          content:
            application/problem+json:
              schema:
                description: 'An error generated by the Mailchimp API. The response conforms to [RFC 9457: Problem Details for HTTP APIs](https://www.rfc-editor.org/rfc/rfc9457).'
                properties:
                  detail:
                    description: A human-readable explanation specific to this occurrence of the problem. [Learn more about errors](/developer/guides/get-started-with-mailchimp-api-3/#Errors).
