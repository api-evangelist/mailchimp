  /facebook-ads/{outreach_id}:
    get:
      description: Get details of a Facebook ad.
      parameters:
      - name: fields
        x-title: Fields
        in: query
        description: A comma-separated list of fields to return. Reference parameters of sub-objects with dot notation.
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - in: path
        name: outreach_id
        x-title: Outreach ID
        required: true
        description: The outreach id.
        schema:
          type: string
      - name: exclude_fields
        x-title: Exclude Fields
        in: query
        description: A comma-separated list of fields to exclude. Reference parameters of sub-objects with dot notation.
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Facebook Ad Instance
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    id:
                      type: string
                      title: ID
                      description: Unique ID of an Outreach.
                    web_id:
                      type: integer
                      title: Web ID
                      description: The ID used in the Mailchimp web application. For example, for a `regular` outreach, you can view this campaign in your Mailchimp account at `https://{dc}.admin.mailchimp.com/campaigns/show/?id={web_id}`.
                    name:
                      type: string
                      title: Name
                      description: Title or name of an Outreach.
                    type:
                      type: string
                      title: Outreach Type
                      description: The type of outreach this object is.
                      enum:
                      - regular
                      - email-touchpoint
                      - plaintext
                      - rss
                      - reconfirm
                      - variate
                      - absplit
                      - automation
                      - facebook
                      - google
                      - autoresponder
                      - transactional
                      - page
                      - website
                      - social_post
                      - survey
                      - customer_journey
                      - sms
                    status:
                      type: string
                      title: Outreach Status
                      description: The status of this outreach.
                      enum:
                      - save
                      - paused
                      - schedule
                      - scheduled
                      - sending
                      - sent
                      - canceled
                      - canceling
                      - active
                      - disconnected
                      - somepaused
                      - draft
                      - completed
                      - partialRejected
                      - pending
                      - rejected
                      - published
                      - unpublished
                    show_report:
                      type: boolean
                      title: Show Report
                      description: 'Outreach report availability. Note: This property is hotly debated in what it _should_ convey. See [MCP-1371](https://jira.mailchimp.com/browse/MCP-1371) for more context.'
                    create_time:
                      type: string
                      title: Create Time
                      format: date-time
                      description: The date and time the outreach was created in ISO 8601 format.
                    start_time:
                      type: string
                      title: Start Time
                      format: date-time
                      description: The date and time the outreach was started in ISO 8601 format.
                    updated_at:
                      type: string
                      title: Updated At
                      format: date-time
                      description: The date and time the outreach was last updated in ISO 8601 format.
                    canceled_at:
                      type: string
                      title: Canceled At
                      format: date-time
                      description: The date and time the outreach was canceled in ISO 8601 format.
                    published_time:
                      type: string
                      title: Publish Time
                      format: date-time
                      description: The date and time the outreach was (or will be) published in ISO 8601 format.
                    has_segment:
                      type: boolean
                      title: Has Segment
                      description: If this outreach targets a segment of your audience.
                    report_summary:
                      type: object
                      title: Report Summary
                      description: High level reporting stats for an outreach.
                      properties:
                        opens:
                          type: integer
                        proxy_excluded_opens:
                          type: integer
                        unique_opens:
                          type: integer
                        proxy_excluded_unique_opens:
                          type: integer
                        open_rate:
                          type: number
                        proxy_excluded_open_rate:
                          type: number
                        clicks:
                          type: integer
                        subscriber_clicks:
                          type: integer
                        click_rate:
                          type: number
                        visits:
                          type: integer
                        unique_visits:
                          type: integer
                        conversion_rate:
                          type: number
                        subscribes:
                          type: integer
                        ecommerce:
                          type: object
                          properties:
                            total_revenue:
                              type: number
                            currency_code:
                              type: string
                            average_order_revenue:
                              type: number
                        impressions:
                          type: number
                        reach:
                          type: integer
                        engagements:
                          type: integer
                        total_sent:
                          type: integer
                    recipients:
                      type: object
                      title: Recipients
                      description: High level audience information for who the outreach targets.
                      properties:
                        list_id:
                          type: string
                          title: List ID
                          description: The unique list id.
                        list_is_active:
                          type: boolean
                          title: List Status
                          description: The status of the list used, namely if it's deleted or disabled.
                          readOnly: true
                        list_name:
                          type: string
                          title: List Name
                          description: The name of the list.
                          readOnly: true
                        segment_text:
                          type: string
                          title: Segment Text
                          description: A description of the [segment](https://mailchimp.com/help/save-and-manage-segments/) used for the campaign. Formatted as a string marked up with HTML.
                          readOnly: true
                        recipient_count:
