                    field:
                      description: 'Only for conditions. The contact attribute that the condition tests. The `field` property identifies a node as a condition. Each field has its own operators, values, and filters. Contact data: `merge0` (email address), `merge<N>` (merge field by `merge_id`; its operators change with its type), `language`, `gmonkey` (VIP), `rating` (1-5), `timestamp_opt` (subscription date), `info_changed`, `metadata_created` (date the contact was added), `original_signup_source`, `static_segment` (tags, by tag ID), `interests-<N>` (groups; beta), `list_email_status`, `marketing_preference` (beta), `age_gating`, `ipgeo` (predicted location; uses `location`). Messages: `email_campaign_activity` (sent, opened, clicked, bounced; filter by campaign `web_id` and time period), `email_marketing_engagement`, `sms_campaign_activity`, `sms_bounce_reason`, `sms_contact_status`, `sms_timestamp_opt`, `sms_country_code`, `whatsapp_campaign_interaction`, `whatsapp_contact_status`, `whatsapp_timestamp_opt`. E-commerce (connected store): `ecomm` (purchases; filter by date, campaign, store, product, variant, vendor, collection, total, and count), `total_spent`, `spent_avg`, `orders_count`, `ecomm_page_viewed`, `ecomm_product_viewed`, `ecomm_collection_viewed`, `ecomm_search_submitted`, `ecomm_product_added_to_cart`, `ecomm_checkout_started`, `ecomm_review_submitted`, `ecomm_back_in_stock_request`. Predictions and integrations: `predicted_clv`, `likelihood_to_purchase` (0-1000), `time_to_next_purchase`, `ecomm_churn_risk`, `clv_lifetime_value` and `clv_lifecycle` (earlier customer lifetime value fields), `age_range`, `gender`, `lead_ad`, `booking_activity`, `qbo_invoice_activity`, `qbo_sales_receipt_activity`. Events: `contact_event` (events from the Events API; filter by name, time period, and property), `custom_event_<namespace>_<event>` (with `namespace`, `event_name`, and typed `custom_event_property_*` filters). To count how many times an event occurred, use the