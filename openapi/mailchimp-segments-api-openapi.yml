              properties:
                definition:
                  description: 'A node in a segment definition. A node is a group or a condition. A group contains the `match` property and combines the nodes in its `conditions` array. A condition contains the `field` property and tests one contact attribute. A node cannot contain both `match` and `field`. The root node of a definition is always a group. In a request, the root group must contain `match` and `conditions`. This schema shows the properties of both node types together. Limits: A definition can contain a maximum of 100 conditions, including the conditions in `filters`. A definition can contain a maximum of 2 levels of groups. The root group is level 1. The Mailchimp segment builder uses the same group limit. If a definition is more than a limit, the API returns a 400 error. In this API version, Mailchimp does not change or remove existing fields, but Mailchimp can add new fields. Make sure that your client ignores fields that it does not know.'
                  required:
                  - match
                  - conditions
                  properties:
                    conditions:
                      type: array
                      title: Conditions
                      description: Only for groups. The nodes in the group. Each item is a condition or a group, and one array can contain both. Each item has the same properties as this node. A definition can contain a maximum of 100 conditions, including the conditions in `filters`. A definition can contain a maximum of 2 levels of groups. The root group is level 1.
