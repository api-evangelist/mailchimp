openapi: 3.2.0
info:
  contact:
    email: apihelp@mailchimp.com
    name: Mailchimp API Support
  description: 'Whether you’re managing your own campaigns, providing Mailchimp services to your customers or clients, or writing a mobile app, the Mailchimp API has features to manage and sync your contact data.


    Audiences are at the core of sending campaigns with Mailchimp. You can use the API to set up an audience and add contacts to that audience; you can then organize those contacts with tags or segment them by activity with events.


    The API can also be a source of data for your application. Webhooks collect and transmit information about your audience to you in near real time. And if you’re selling products on an external store, you can integrate your audience behavior using Mailchimp’s E-commerce features.


    You can also use the API to handle data in different ways for different purposes. If you are syncing a large amount of data with Mailchimp, you can use batches to avoid hitting the API request limits. For building integrations that let other users access data from their own Mailchimp accounts, you should authenticate with OAuth 2. And if you’re developing an app for iOS or Android, the Mobile SDK provides an easy way to work with a mobile-focused subset of the API’s functionality.'
  summary: Manage audiences, integrate your data, and send timely, relevant email campaigns.
  termsOfService: https://mailchimp.com/legal/api_use/
  title: Mailchimp Segments API
  version: 0.1.0-dev
servers:
- description: Mailchimp API
  url: https://api.mailchimp.com
security:
- bearerToken: []
- oauth2: []
tags:
- name: Segments
paths:
  /3.0/segments:
    get:
      deprecated: false
      description: Get the segments of a list. The response contains only metadata. It includes advanced segments and read-only segments that other Mailchimp tools made, for example Google Analytics segments and segments from the AI segment builder. The `read_only` property of each segment shows if you can update it.
      operationId: getSegmentList
      parameters:
      - description: A comma-separated list of fields to return. Reference parameters of sub-objects with dot notation.
        explode: false
        in: query
        name: fields
        schema:
          items:
            type: string
          type: array
          x-title: Fields
        style: form
        x-title: Fields
      - description: A comma-separated list of fields to exclude. Reference parameters of sub-objects with dot notation.
        explode: false
        in: query
        name: exclude_fields
        schema:
          items:
            type: string
          type: array
          x-title: Exclude Fields
        style: form
        x-title: Exclude Fields
      - description: The number of segments to return. The default is 10. Use a whole number from 1 to 1000. If you use a different value, the API returns a 400 error. The API does not change the value.
        in: query
        name: count
        required: false
        schema:
          default: 10
          maximum: 1000
          minimum: 1
          type: integer
          x-title: Count
        x-title: Count
      - description: To get the next page of segments, set `cursor` to the `next_cursor` value from the previous response. Do not make or change a cursor value. If you do, pagination can stop without notice. To get the first page, do not include `cursor`. If a response does not contain `next_cursor`, there are no more pages. If segments are created or deleted while you get the pages, the response can skip or repeat a segment.
        in: query
        name: cursor
        required: false
        schema:
          type: string
          x-title: cursor
        x-title: cursor
      - description: The unique ID of the list to get segments from.
        in: query
        name: list_id
        required: true
        schema:
          type: string
      - description: The field to sort the segments by.
        in: query
        name: sort_field
        schema:
          enum:
          - created_at
          - name
          type: string
      - description: The sort direction. The default is DESC. Use ASC or DESC. The value is not case-sensitive. If you use a different value, the API returns a 400 error.
        in: query
        name: sort_dir
        required: false
        schema:
          default: DESC
          enum:
          - ASC
          - DESC
          type: string
          x-title: Sort Direction
        x-title: Sort Direction
      responses:
        '200':
          content:
            application/json:
              schema:
                description: A list of segments. Each segment contains only its metadata.
                properties:
                  _links:
                    description: A list of link types and descriptions for the API schema documents.
                    items:
                      description: This object represents a link from the resource where it is found to another resource or action that may be performed.
                      properties:
                        href:
                          description: This property contains a fully-qualified URL that can be called to retrieve the linked resource or perform the linked action.
                          readOnly: true
                          title: Href
                          type: string
                        method:
                          description: The HTTP method that should be used when accessing the URL defined in 'href'.
                          enum:
                          - GET
                          - POST
                          - PUT
                          - PATCH
                          - DELETE
                          - OPTIONS
                          - HEAD
                          readOnly: true
                          title: Method
                          type: string
                        rel:
                          description: As with an HTML 'rel' attribute, this describes the type of link.
                          readOnly: true
                          title: Rel
                          type: string
                        schema:
                          description: For HTTP methods that can receive bodies (POST and PUT), this is a URL representing the schema that the body should conform to.
                          readOnly: true
                          title: Schema
                          type: string
                        targetSchema:
                          description: For GETs, this is a URL representing the schema that the response should conform to.
                          readOnly: true
                          title: Target Schema
                          type: string
                      title: Resource Link
                      type: object
                    readOnly: true
                    title: Links
                    type: array
                  next_cursor:
                    description: A cursor pointing to the last item on this page of the collection. Paginate through a collection of records by setting the `cursor` parameter on a subsequent request to this value.
                    readOnly: true
                    title: Next Cursor
                    type: string
                  segments:
                    description: The segments of the list. The `read_only` property of each segment shows if you can update it.
                    items:
                      description: The metadata of a segment in the segment list. It does not include the `definition` or a member count. In this API version, Mailchimp does not change or remove existing fields, but Mailchimp can add new fields. Make sure that your client ignores fields that it does not know.
                      properties:
                        created_at:
                          description: The date and time when Mailchimp created the segment, in ISO 8601 format.
                          example: '2025-01-15T10:30:00+00:00'
                          format: date-time
                          readOnly: true
                          title: Created At
                          type: string
                        id:
                          description: The unique ID of the segment. Do not parse or change this value. Use it exactly as you received it.
                          example: 0dbaba26-0003-8000-8000-000000000919
                          readOnly: true
                          title: Segment ID
                          type: string
                          format: uuid
                        list_id:
                          description: The unique ID of the list that contains the segment.
                          example: a1b2c3d4e5
                          title: List ID
                          type: string
                          readOnly: true
                        read_only:
                          type: boolean
                          title: Read Only
                          description: If true, you can read, count, and snapshot the segment, but you cannot update or delete it. Segments that other Mailchimp tools made, for example Google Analytics segments, are read-only. A read-only segment does not have a definition.
                          readOnly: true
                        name:
                          description: The name of the segment.
                          example: Example Segment
                          title: Segment Name
                          type: string
                      title: Segment (List Item)
                      type: object
                    title: Segments
                    type: array
                type: object
          description: ''
        default:
          content:
            application/problem+json:
              schema:
                description: 'An error generated by the Mailchimp API. The response conforms to [RFC 9457: Problem Details for HTTP APIs](https://www.rfc-editor.org/rfc/rfc9457).'
                properties:
                  detail:
                    description: A human-readable explanation specific to this occurrence of the problem. [Learn more about errors](/developer/guides/get-started-with-mailchimp-api-3/#Errors).
                    examples:
                    - The requested resource could not be found.
                    title: Error Message
                    type: string
                  instance:
                    description: A string that identifies this specific occurrence of the problem. Please provide this ID when contacting support.
                    examples:
                    - 995c5cb0-3280-4a6e-808b-3b096d0bb219
                    title: Instance ID
                    type: string
                  status:
                    description: The HTTP status code (RFC2616, Section 6) generated by the origin server for this occurrence of the problem.
                    examples:
                    - 404
                    title: HTTP Status Code
                    type: integer
                  title:
                    description: A short, human-readable summary of the problem type. It shouldn't change based on the occurrence of the problem, except for purposes of localization.
                    examples:
                    - Resource Not Found
                    title: Error Title
                    type: string
                  type:
                    description: An absolute URI that identifies the problem type. When dereferenced, it should provide human-readable documentation for the problem type.
                    examples:
                    - https://mailchimp.com/developer/marketing/docs/errors/
                    title: Problem Type
                    type: string
                required:
                - detail
                - instance
                - status
                - title
                - type
                title: Problem Detail Document
                type: object
          description: An error generated by the Mailchimp API.
      summary: List Segments
      tags:
      - Segments
      x-custom-config:
        methodNameCamel: listSegmentList
        methodNameSnake: list_segment_list
    post:
      description: Create an advanced segment from a segment definition. The account's plan must include advanced segmentation. If it does not, the API returns a 403 error.
      operationId: createSegment
      requestBody:
        description: The advanced segment to create.
        content:
          application/json:
            schema:
              description: The advanced segment to create.
              properties:
                definition:
                  description: 'A node in a segment definition. A node is a group or a condition. A group contains the `match` property and combines the nodes in its `conditions` array. A condition contains the `field` property and tests one contact attribute. A node cannot contain both `match` and `field`. The root node of a definition is always a group. In a request, the root group must contain `match` and `conditions`. This schema shows the properties of both node types together. Limits: A definition can contain a maximum of 100 conditions, including the conditions in `filters`. A definition can contain a maximum of 2 levels of groups. The root group is level 1. The Mailchimp segment builder uses the same group limit. If a definition is more than a limit, the API returns a 400 error. In this API version, Mailchimp does not change or remove existing fields, but Mailchimp can add new fields. Make sure that your client ignores fields that it does not know.'
                  required:
                  - match
                  - conditions
                  properties:
                    conditions:
                      type: array
                      title: Conditions
                      description: Only for groups. The nodes in the group. Each item is a condition or a group, and one array can contain both. Each item has the same properties as this node. A definition can contain a maximum of 100 conditions, including the conditions in `filters`. A definition can contain a maximum of 2 levels of groups. The root group is level 1.
                      items:
                        type: object
                    contacts:
                      description: 'The contacts that the segment can include, by channel and subscription status. Use this object only in the root group. If you do not include it, the segment can include all contacts on all channels: email, SMS, and WhatsApp. In a request, one entry can select more than one subscription status. For example, `{"sendable": false}` selects all statuses that cannot receive marketing on that channel. In a response, each entry selects exactly one subscription status. If you send a response object in a request, it selects the same contacts.'
                      properties:
                        email:
                          properties:
                            marketing:
                              items:
                                properties:
                                  consent:
                                    description: Selects a subset of the contacts that cannot receive marketing. `confirmed`, or no value, selects all of these contacts. `denied` selects only the contacts that unsubscribed. `unknown` selects only the contacts that never subscribed. On email, these are the contacts that can receive only transactional email. If `sendable` is true, the only permitted value is `confirmed`. Do not use `consent` with `reason`. If a request breaks one of these rules, the API returns a 400 error. On email, `denied` also selects the contacts that an account admin unsubscribed.
                                    enum:
                                    - unknown
                                    - confirmed
                                    - denied
                                    title: Consent
                                    type: string
                                  reason:
                                    description: Selects the contacts that Mailchimp removed because of delivery problems (cleaned contacts). Use it only on email, and only when `sendable` is false. Do not use it with `consent`. If a request breaks one of these rules, the API returns a 400 error.
                                    enum:
                                    - deliverability
                                    title: Reason
                                    type: string
                                  sendable:
                                    description: Shows if the contacts can receive marketing on this channel now. Use it with `consent` and `reason` to select subscription statuses.
                                    title: Sendable
                                    type: boolean
                                required:
                                - sendable
                                title: Marketing
                                type: object
                              title: Marketing
                              description: The marketing subscription statuses that the segment includes on this channel. Each entry selects one or more statuses. The segment includes the contacts of all entries.
                              type: array
                            transactional:
                              items:
                                properties:
                                  sendable:
                                    description: If true, the segment includes the contacts that can receive only transactional email. The API accepts false, but false selects no contacts.
                                    title: Sendable
                                    type: boolean
                                required:
                                - sendable
                                title: Transactional
                                type: object
                              title: Transactional
                              description: The transactional email statuses that the segment includes. This is an array, the same as `marketing`. Only one entry has an effect.
                              type: array
                          title: Email
                          type: object
                        sms:
                          properties:
                            marketing:
                              items:
                                properties:
                                  consent:
                                    description: Selects a subset of the contacts that cannot receive marketing. `confirmed`, or no value, selects all of these contacts. `denied` selects only the contacts that unsubscribed. `unknown` selects only the contacts that never subscribed. On email, these are the contacts that can receive only transactional email. If `sendable` is true, the only permitted value is `confirmed`. Do not use `consent` with `reason`. If a request breaks one of these rules, the API returns a 400 error. On email, `denied` also selects the contacts that an account admin unsubscribed.
                                    enum:
                                    - unknown
                                    - confirmed
                                    - denied
                                    title: Consent
                                    type: string
                                  reason:
                                    description: Selects the contacts that Mailchimp removed because of delivery problems (cleaned contacts). Use it only on email, and only when `sendable` is false. Do not use it with `consent`. If a request breaks one of these rules, the API returns a 400 error.
                                    enum:
                                    - deliverability
                                    title: Reason
                                    type: string
                                  sendable:
                                    description: Shows if the contacts can receive marketing on this channel now. Use it with `consent` and `reason` to select subscription statuses.
                                    title: Sendable
                                    type: boolean
                                required:
                                - sendable
                                title: Marketing
                                type: object
                              title: Marketing
                              description: The marketing subscription statuses that the segment includes on this channel. Each entry selects one or more statuses. The segment includes the contacts of all entries.
                              type: array
                            transactional:
                              type: array
                              title: Transactional
                              description: Reserved. Do not use this property. If a request includes it, the API returns a 400 error.
                              items:
                                properties:
                                  sendable:
                                    description: If true, the segment includes the contacts that can receive only transactional email. The API accepts false, but false selects no contacts.
                                    title: Sendable
                                    type: boolean
                                required:
                                - sendable
                                title: Transactional
                                type: object
                          title: SMS
                          type: object
                        whatsapp:
                          properties:
                            marketing:
                              items:
                                properties:
                                  consent:
                                    description: Selects a subset of the contacts that cannot receive marketing. `confirmed`, or no value, selects all of these contacts. `denied` selects only the contacts that unsubscribed. `unknown` selects only the contacts that never subscribed. On email, these are the contacts that can receive only transactional email. If `sendable` is true, the only permitted value is `confirmed`. Do not use `consent` with `reason`. If a request breaks one of these rules, the API returns a 400 error. On email, `denied` also selects the contacts that an account admin unsubscribed.
                                    enum:
                                    - unknown
                                    - confirmed
                                    - denied
                                    title: Consent
                                    type: string
                                  reason:
                                    description: Selects the contacts that Mailchimp removed because of delivery problems (cleaned contacts). Use it only on email, and only when `sendable` is false. Do not use it with `consent`. If a request breaks one of these rules, the API returns a 400 error.
                                    enum:
                                    - deliverability
                                    title: Reason
                                    type: string
                                  sendable:
                                    description: Shows if the contacts can receive marketing on this channel now. Use it with `consent` and `reason` to select subscription statuses.
                                    title: Sendable
                                    type: boolean
                                required:
                                - sendable
                                title: Marketing
                                type: object
                              title: Marketing
                              description: The marketing subscription statuses that the segment includes on this channel. Each entry selects one or more statuses. The segment includes the contacts of all entries.
                              type: array
                            transactional:
                              type: array
                              title: Transactional
                              description: Reserved. Do not use this property. If a request includes it, the API returns a 400 error.
                              items:
                                properties:
                                  sendable:
                                    description: If true, the segment includes the contacts that can receive only transactional email. The API accepts false, but false selects no contacts.
                                    title: Sendable
                                    type: boolean
                                required:
                                - sendable
                                title: Transactional
                                type: object
                          title: WhatsApp
                          type: object
                      title: Contacts
                      type: object
                    extra:
                      description: Only for conditions. More data for some conditions (a string or an array). Its meaning changes with the field.
                      title: Extra
                    field:
                      description: 'Only for conditions. The contact attribute that the condition tests. The `field` property identifies a node as a condition. Each field has its own operators, values, and filters. Contact data: `merge0` (email address), `merge<N>` (merge field by `merge_id`; its operators change with its type), `language`, `gmonkey` (VIP), `rating` (1-5), `timestamp_opt` (subscription date), `info_changed`, `metadata_created` (date the contact was added), `original_signup_source`, `static_segment` (tags, by tag ID), `interests-<N>` (groups; beta), `list_email_status`, `marketing_preference` (beta), `age_gating`, `ipgeo` (predicted location; uses `location`). Messages: `email_campaign_activity` (sent, opened, clicked, bounced; filter by campaign `web_id` and time period), `email_marketing_engagement`, `sms_campaign_activity`, `sms_bounce_reason`, `sms_contact_status`, `sms_timestamp_opt`, `sms_country_code`, `whatsapp_campaign_interaction`, `whatsapp_contact_status`, `whatsapp_timestamp_opt`. E-commerce (connected store): `ecomm` (purchases; filter by date, campaign, store, product, variant, vendor, collection, total, and count), `total_spent`, `spent_avg`, `orders_count`, `ecomm_page_viewed`, `ecomm_product_viewed`, `ecomm_collection_viewed`, `ecomm_search_submitted`, `ecomm_product_added_to_cart`, `ecomm_checkout_started`, `ecomm_review_submitted`, `ecomm_back_in_stock_request`. Predictions and integrations: `predicted_clv`, `likelihood_to_purchase` (0-1000), `time_to_next_purchase`, `ecomm_churn_risk`, `clv_lifetime_value` and `clv_lifecycle` (earlier customer lifetime value fields), `age_range`, `gender`, `lead_ad`, `booking_activity`, `qbo_invoice_activity`, `qbo_sales_receipt_activity`. Events: `contact_event` (events from the Events API; filter by name, time period, and property), `custom_event_<namespace>_<event>` (with `namespace`, `event_name`, and typed `custom_event_property_*` filters). To count how many times an event occurred, use the `number_events` filter.'
                      title: Field
                      type: string
                    filters:
                      type: array
                      title: Filters
                      description: Only for conditions. Filters that limit what the condition selects, for example the campaign and time period filters of `email_campaign_activity`. A filter can contain more filters. A filter cannot contain a group. Each filter has the same properties as a condition.
                      items:
                        type: object
                    location:
                      description: The geographic limits of a predicted location (`ipgeo`) condition.
                      properties:
                        city:
                          title: City
                          type: string
                        country_code:
                          description: The two-letter country code.
                          title: Country Code
                          type: string
                        lat:
                          title: Latitude
                          type: number
                        lng:
                          title: Longitude
                          type: number
                        region:
                          title: Region
                          type: string
                      title: Location
                      type: object
                    match:
                      description: Only for groups. How the group combines its nodes. `all` selects contacts that agree with all nodes. `any` selects contacts that agree with one or more nodes. The `match` property identifies a node as a group.
                      enum:
                      - all
                      - any
                      title: Match
                      type: string
                    op:
                      description: Only for conditions. The comparison that the condition uses. Each condition and each filter must have an operator. Each field has its own operators, for example `is`, `contains`, `greater`, or `date_within`. On some fields, the operator `any` applies no limit.
                      title: Op
                      type: string
                    schema_version:
                      description: Reserved for later versions of this format. Use it only in the root group. The API accepts all values. Responses always show the current version, 2.
                      title: Schema Version
                      type: integer
                    value:
                      description: Only for conditions. The value that the condition compares with. Its type (string, number, boolean, or array) changes with the field and the operator. For a campaign, use its `web_id` from `/campaigns`. For a tag, use its integer tag ID. Interest groups, marketing permissions, and e-commerce stores use Mailchimp's own ID values (beta). To get one of these IDs, make a segment in Mailchimp. Then read the segment through this API and copy the ID.
                      title: Value
                    value_op:
                      description: Only for conditions. How the condition combines the items in `value`, for merge field conditions that accept more than one value. `or` selects contacts that agree with one or more items. `and` selects contacts that agree with all items.
                      enum:
                      - and
                      - or
                      title: Value Op
                      type: string
                  title: Segment Definition
                  type: object
                  example:
                    schema_version: 2
                    contacts:
                      email:
                        marketing:
                        - sendable: true
                    match: all
                    conditions:
                    - field: merge0
                      op: contains
                      value:
                      - yahoo.com
                list_id:
                  description: The unique ID of the list that contains the segment.
                  example: a1b2c3d4e5
                  title: List ID
                  type: string
                name:
                  description: The name of the segment.
                  example: Example Segment
                  title: Segment Name
                  type: string
              required:
              - name
              - list_id
              - definition
              title: Segment
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                description: A segment. It is an advanced segment, or a read-only segment that a different Mailchimp tool made. In this API version, Mailchimp does not change or remove existing fields, but Mailchimp can add new fields. Make sure that your client ignores fields that it does not know.
                properties:
                  created_at:
                    description: The date and time when Mailchimp created the segment, in ISO 8601 format.
                    example: '2025-01-15T10:30:00+00:00'
                    format: date-time
                    readOnly: true
                    title: Created At
                    type: string
                  definition:
                    type: object
                    title: Segment Definition
                    description: The segment definition. Read-only segments do not have a definition, so the response does not include this property for them. It contains the `match` and `conditions` that you sent, the current `schema_version`, and the `contacts` object. In the `contacts` object, each entry selects exactly one subscription status. The request body of Add Segment shows all properties of a definition.
                    additionalProperties:
                      description: 'The properties of the definition: `schema_version`, `contacts`, `match`, and `conditions`.'
                  id:
                    description: The unique ID of the segment. Do not parse or change this value. Use it exactly as you received it.
                    example: 0dbaba26-0003-8000-8000-000000000919
                    readOnly: true
                    title: Segment ID
                    type: string
                    format: uuid
                  list_id:
                    description: The unique ID of the list that contains the segment.
                    example: a1b2c3d4e5
                    title: List ID
                    type: string
                    readOnly: true
                  read_only:
                    type: boolean
                    title: Read Only
                    description: If true, you can read, count, and snapshot the segment, but you cannot update or delete it. Segments that other Mailchimp tools made, for example Google Analytics segments, are read-only. A read-only segment does not have a definition.
                    readOnly: true
                  name:
                    description: The name of the segment.
                    example: Example Segment
                    title: Segment Name
                    type: string
                title: Segment
                type: object
          description: ''
        default:
          content:
            application/problem+json:
              schema:
                description: 'An error generated by the Mailchimp API. The response conforms to [RFC 9457: Problem Details for HTTP APIs](https://www.rfc-editor.org/rfc/rfc9457).'
                properties:
                  detail:
                    description: A human-readable explanation specific to this occurrence of the problem. [Learn more about errors](/developer/guides/get-started-with-mailchimp-api-3/#Errors).
                    examples:
                    - The requested resource could not be found.
                    title: Error Message
                    type: string
                  instance:
                    description: A string that identifies this specific occurrence of the problem. Please provide this ID when contacting support.
                    examples:
                    - 995c5cb0-3280-4a6e-808b-3b096d0bb219
                    title: Instance ID
                    type: string
                  status:
                    description: The HTTP status code (RFC2616, Section 6) generated by the origin server for this occurrence of the problem.
                    examples:
                    - 404
                    title: HTTP Status Code
                    type: integer
                  title:
                    description: A short, human-readable summary of the problem type. It shouldn't change based on the occurrence of the problem, except for purposes of localization.
                    examples:
                    - Resource Not Found
                    title: Error Title
                    type: string
                  type:
                    description: An absolute URI that identifies the problem type. When dereferenced, it should provide human-readable documentation for the problem type.
                    examples:
                    - https://mailchimp.com/developer/marketing/docs/errors/
                    title: Problem Type
                    type: string
                required:
                - detail
                - instance
                - status
                - title
                - type
                title: Problem Detail Document
                type: object
          description: An error generated by the Mailchimp API.
      summary: Add Segment
      tags:
      - Segments
      x-custom-config:
        methodNameCamel: createSegment
        methodNameSnake: create_segment
  /3.0/segments/{segment_id}:
    delete:
      description: Delete an advanced segment. You cannot delete a read-only segment.
      operationId: deleteSegment
      parameters:
      - description: The unique id for the segment.
        in: path
        name: segment_id
        required: true
        schema:
          type: string
          x-title: Segment ID
        x-title: Segment ID
      responses:
        '204':
          content: {}
          description: Empty Response
        default:
          content:
            application/problem+json:
              schema:
                description: 'An error generated by the Mailchimp API. The response conforms to [RFC 9457: Problem Details for HTTP APIs](https://www.rfc-editor.org/rfc/rfc9457).'
