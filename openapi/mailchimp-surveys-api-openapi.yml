                              type: integer
                              title: Subject Line
                              description: The index of `variate_settings.subject_lines` used.
                            send_time:
                              type: integer
                              title: Send Time
                              description: The index of `variate_settings.send_times` used.
                            from_name:
                              type: integer
                              title: From Name
                              description: The index of `variate_settings.from_names` used.
