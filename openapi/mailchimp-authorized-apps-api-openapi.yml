                                readOnly: true
                                title: Rel
                                type: string
                              schema:
                                description: For HTTP methods that can receive bodies (POST and PUT), this is a URL representing the schema that the body should conform to.
                                readOnly: true
                                title: Schema
                                type: string
                              targetSchema:
                                description: For GETs, this is a URL representing the schema that the response should conform to.
                                readOnly: true
                                title: Target Schema
                                type: string
                            title: Resource Link
                            type: object
                          readOnly: true
                          title: Links
                          type: array
                        description:
                          description: A short description of the application.
                          title: Application Description
                          type: string
                        id:
                          description: The ID for the application.
                          title: Client ID
                          type: integer
                        name:
                          description: The name of the application.
                          title: Application Name
                          type: string
                        users:
                          description: An array of usernames for users who have linked the app.
                          items:
                            type: string
                          title: Application Users
                          type: array
                      type: object
                    title: Authorized Applications
                    type: array
                  total_items:
                    description: The total number of items matching the query regardless of pagination.
                    readOnly: true
                    title: Item Count
                    type: integer
                type: object
          description: ''
        default:
          content:
            application/problem+json:
              schema:
                description: 'An error generated by the Mailchimp API. The response conforms to [RFC 9457: Problem Details for HTTP APIs](https://www.rfc-editor.org/rfc/rfc9457).'
                properties:
                  detail:
                    description: A human-readable explanation specific to this occurrence of the problem. [Learn more about errors](/developer/guides/get-started-with-mailchimp-api-3/#Errors).
                    examples:
                    - The requested resource could not be found.
                    title: Error Message
                    type: string
                  instance:
                    description: A string that identifies this specific occurrence of the problem. Please provide this ID when contacting support.
                    examples:
                    - 995c5cb0-3280-4a6e-808b-3b096d0bb219
                    title: Instance ID
                    type: string
                  status:
                    description: The HTTP status code (RFC2616, Section 6) generated by the origin server for this occurrence of the problem.
                    examples:
                    - 404
                    title: HTTP Status Code
                    type: integer
                  title:
                    description: A short, human-readable summary of the problem type. It shouldn't change based on the occurrence of the problem, except for purposes of localization.
                    examples:
                    - Resource Not Found
                    title: Error Title
                    type: string
                  type:
                    description: An absolute URI that identifies the problem type. When dereferenced, it should provide human-readable documentation for the problem type.
                    examples:
                    - https://mailchimp.com/developer/marketing/docs/errors/
