                    type: string
                required:
                - detail
                - instance
                - status
                - title
                - type
                title: Problem Detail Document
                type: object
          description: An error generated by the Mailchimp API.
      summary: List authorized apps
      tags:
      - authorized-apps
      x-custom-config:
        methodNameCamel: list
        methodNameSnake: list
