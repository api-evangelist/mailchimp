      - in: path
        name: campaign_id
        x-title: Campaign ID
        required: true
        description: The unique id for the campaign.
        schema:
          type: string
      - name: sort_field
        x-title: Sort By Field
        description: Returns click reports sorted by the specified field.
        in: query
        required: false
        schema:
          type: string
          enum:
          - total_clicks
          - unique_clicks
      - name: sort_dir
        x-title: Sort Direction
        description: Determines the order direction for sorted results.
        in: query
        required: false
        schema:
          type: string
          enum:
          - ASC
          - DESC
      - name: filter_bots
        x-title: Filter Bots
        in: query
        description: When true, exclude automated bot clicks so the returned click counts reflect human clicks only, matching the in-app Recipient Activity view. Filtering changes a link's counts, but never removes a link from the response. Defaults to false (all clicks).
