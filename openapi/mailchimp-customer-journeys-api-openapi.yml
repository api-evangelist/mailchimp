paths:
  /3.0/customer-journeys/journeys/{journey_id}/steps/{step_id}/actions/trigger:
    post:
      description: A step trigger in an Automation flow. To use it, create a starting point or step from the Automation flow builder in the app using the Customer Journeys API condition. We’ll provide a url during the process that includes the {journey_id} and {step_id}. You’ll then be able to use this endpoint to trigger the condition for the posted contact.
      operationId: postCustomerJourneysJourneysIdStepsIdActionsTrigger
      parameters:
      - description: The id for the flow.
        in: path
        name: journey_id
        required: true
        schema:
          type: integer
