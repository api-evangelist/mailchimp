    category: account
    rest: [postUsersInfo, postUsersPing]
    binding: rest
    confidence: high
    note: /users/info returns account reputation, quota and backlog; /users/ping is the credential check.
  - tool: call_api
    category: proxy
    rest: ['*']
    binding: rest
    confidence: low
    note: >-
      A generic proxy tool — it can invoke any Transactional endpoint, so it fans
      out to all 99 operations rather than binding to one. Its real input contract
      is the endpoint name plus that endpoint's own parameters.
  - tool: describe_api
    category: introspection
    rest: []
