description: >-
  What the Mailchimp MCP surface can do versus what the REST surface can do. The
  hosted MCP server covers the TRANSACTIONAL API ONLY, and most of its tools are
  meta-tools — they describe, diagnose or proxy the API rather than mapping to one
  operation. The entire Marketing API (298 operations) has no first-party MCP tool
  at all. Live tools/list introspection is auth-gated, so input schemas were not
  read from the server; bindings below are by name and documented semantics.
surfaces:
