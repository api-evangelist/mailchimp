tags:
- Rate Limiting
- Email
description: Mailchimp rate-limits the Marketing API by CONCURRENCY, not by a request quota over a window. There is no published per-minute or per-hour ceiling, and — the finding that matters most for an agent — the API returns NO rate-limit response headers at all. A client cannot read how much budget it has left; it can only hold its own concurrency below 10 and react to a 429. At very high volume the throttle can also surface as a bare 403 with no JSON body, which a naive client will misread as an authorization failure.
headers: {}
headerNotes: 'Probed and searched 2026-08-13: no X-RateLimit-*, RateLimit-*, or Retry-After headers are documented anywhere in the Marketing or Transactional documentation, and none appear in either first-party specification (openapi/mailchimp-marketing-api-openapi-original.json 3.0.91, openapi/mailchimp-transactional-api-openapi-original.json 1.4.1). An empty headers map here is a measured absence, not a gap in the harvest.'
responseCodes:
  throttled: 429
  throttled_alternate: 403
  throttled_alternate_note: '"At exceptionally high volumes, you may receive an HTTP 429 or 403 without a JSON body."'
limits:
- name: Concurrent API connections
  api: mailchimp:mailchimp-marketing-api
  scope: user/datacenter
  metric: concurrent
  limit: 10
  notes: '"The Marketing API has a limit of 10 simultaneous connections. You''ll receive a 429 error if you reach the limit." Counted per user across all apps. Mailchimp states there are currently no options to raise the limit on a per-customer basis.'
  limit_text: The Marketing API has a limit of 10 simultaneous connections.
  source: https://mailchimp.com/developer/marketing/guides/run-async-requests-batch-endpoint/
- name: Open batch operations
  api: mailchimp:mailchimp-marketing-api
  scope: user
  metric: concurrent_batches
  limit: 500
  limit_text: Batch requests are limited to 500 pending requests
  source: https://mailchimp.com/developer/marketing/guides/run-async-requests-batch-endpoint/
- name: Webhook callback response time
  api: mailchimp:mailchimp-marketing-api
  scope: consumer endpoint
  metric: seconds
  limit: 10
  notes: '"If the URL is unavailable or takes more than 10 seconds to respond, the request is canceled and the system will try again later. Retries happen at increasing intervals over the course of 75 minutes." Persistently failing webhooks may be dropped or disabled at Mailchimp''s discretion.'
  limit_text: takes more than 10 seconds to respond
  source: https://mailchimp.com/developer/marketing/guides/sync-audience-data-webhooks/
- name: Webhook signature replay window
  api: mailchimp:mailchimp-marketing-api
  scope: consumer endpoint
  metric: seconds
  limit: 300
  notes: Reject a signed delivery whose X-Mailchimp-Signature timestamp is more than 5 minutes old.
  limit_text: the timestamp is more than 5 minutes old
  source: https://mailchimp.com/developer/marketing/guides/sync-audience-data-webhooks/
notes:
  transactional: Mailchimp publishes no numeric request-rate limit for the Transactional (Mandrill) API. Sending volume is governed by the purchased email block and by account reputation/backlog (readable via /users/info), not by a documented calls-per-second ceiling. The documentation page linked from older references, /developer/transactional/docs/rate-limits/, 302s to the developer home (verified 2026-08-13) — it no longer exists.
evidence:
- source: https://mailchimp.com/developer/marketing/docs/fundamentals/
  http_status: 200
  quotes:
