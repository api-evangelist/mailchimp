name: Mailchimp API Rate Limits
specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Mailchimp
providerId: mailchimp
created: '2026-05-04'
method: searched
modified: '2026-08-13'
reconciled: true
source: https://mailchimp.com/developer/marketing/docs/fundamentals/
docs:
